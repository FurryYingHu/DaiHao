<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>呆浩打砖块</title><style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}body{background:#2d2d2d;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace;padding:10px}.g{background:#1e1e1e;border-radius:30px;padding:20px;max-width:400px;width:100%;border:3px solid #c79b6e;box-shadow:0 10px 0 #6b4f34}.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#fae4bc;border-bottom:2px solid #5f4c38;padding-bottom:10px}.t{font-size:24px;font-weight:bold;text-shadow:2px 2px 0 #8b5a2b}.s{background:#0f0f0f;padding:5px 15px;border-radius:30px;border:1px solid #c79b6e;color:#a6e22e;font-size:24px;font-weight:bold}.c{position:relative;background:#5f4c38;border-radius:20px;margin:10px 0;border:2px solid #8b5a2b;overflow:hidden;touch-action:none}#gameCanvas{width:100%;height:300px;display:block;background:#2a241e;touch-action:none}.m{text-align:center;color:#e6db74;margin:10px 0;min-height:30px}.btn{display:flex;gap:10px;margin-top:10px}button{flex:1;background:#c79b6e;border:none;color:#1e1e1e;font-size:18px;font-weight:bold;padding:12px 0;border-radius:30px;border-bottom:5px solid #7b583a;cursor:pointer;font-family:'Courier New',monospace}button:active{transform:translateY(3px);border-bottom-width:2px}.f{text-align:center;margin-top:15px;color:#5f4c38;font-size:12px}
</style></head><body><div class="g"><div class="h"><span class="t">呆浩打砖块</span><span class="s" id="s">0</span></div><div class="c"><canvas id="gameCanvas" width="360" height="300"></canvas></div><div class="m" id="m">←→移动挡板接球</div><div class="btn"><button id="newGame">🔄 新一局</button><button id="hint">🐾 摸一下</button></div><div class="f">// 呆浩·软工兽 · 打爆砖块</div></div><script>
let canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
let score=0,gameOver=0,win=0,bricks=[],ball={x:180,y:250,dx:2,dy:-2,r:6},paddle={x:130,w:100,h:12};
let sEl=document.getElementById('s'),mEl=document.getElementById('m');
function initBricks(){bricks=[];for(let i=0;i<5;i++)for(let j=0;j<6;j++){if(Math.random()>0.2)bricks.push({x:j*60+5,y:i*25+30,w:50,h:20,val:Math.floor(Math.random()*5+1)*2});}}
function resetGame(){score=0;gameOver=0;win=0;ball={x:180,y:250,dx:2,dy:-2,r:6};paddle.x=130;initBricks();mEl.textContent='←→移动挡板接球';}
function draw(){ctx.clearRect(0,0,360,300);ctx.fillStyle='#c79b6e';bricks.forEach(b=>{ctx.fillStyle=['#6b4f34','#8b5a2b','#b48b60','#c79b6e','#e6b88a'][(b.val/2-1)%5];ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#fae4bc';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#1e1e1e';ctx.font='bold 14px monospace';ctx.fillText(b.val,b.x+15,b.y+16);});
ctx.fillStyle='#fae4bc';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#c79b6e';ctx.fillRect(paddle.x,280,paddle.w,12);ctx.strokeStyle='#8b5a2b';ctx.strokeRect(paddle.x,280,paddle.w,12);
sEl.textContent=score;if(win){ctx.fillStyle='#a6e22e';ctx.font='bold 24px monospace';ctx.fillText('✨ 赢了 ✨',100,150);}else if(gameOver){ctx.fillStyle='#f92672';ctx.font='bold 24px monospace';ctx.fillText('💔 输了',120,150);}}
function update(){if(gameOver||win)return;
ball.x+=ball.dx;ball.y+=ball.dy;
if(ball.x<ball.r||ball.x>360-ball.r)ball.dx*=-1;
if(ball.y<ball.r)ball.dy*=-1;
if(ball.y>290-ball.r&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);ball.dx+=(ball.x-(paddle.x+paddle.w/2))*0.1;}
if(ball.y>300)gameOver=1;
for(let i=bricks.length-1;i>=0;i--){let b=bricks[i];if(ball.x>ball.r+b.x&&ball.x<b.x+b.w+ball.r&&ball.y>ball.r+b.y&&ball.y<b.y+b.h+ball.r){let overlapLeft=ball.x-(b.x-ball.r),overlapRight=(b.x+b.w+ball.r)-ball.x,overlapTop=ball.y-(b.y-ball.r),overlapBottom=(b.y+b.h+ball.r)-ball.y;let minX=Math.min(overlapLeft,overlapRight),minY=Math.min(overlapTop,overlapBottom);if(minX<minY){ball.dx*=-1;}else{ball.dy*=-1;}
score+=b.val;bricks.splice(i,1);break;}}
if(bricks.length==0)win=1;}
function movePaddle(x){if(x<0)x=0;if(x>260)x=260;paddle.x=x;}
canvas.addEventListener('mousemove',e=>{let rect=canvas.getBoundingClientRect();movePaddle((e.clientX-rect.left)*(360/rect.width)-50);});
canvas.addEventListener('touchmove',e=>{e.preventDefault();let rect=canvas.getBoundingClientRect();movePaddle((e.touches[0].clientX-rect.left)*(360/rect.width)-50);},{passive:0});
document.getElementById('newGame').addEventListener('click',()=>{resetGame();});
document.getElementById('hint').addEventListener('click',()=>{if(gameOver||win)resetGame();else{bricks.push({x:Math.random()*300,y:Math.random()*100+30,w:50,h:20,val:Math.floor(Math.random()*5+1)*2});}});
resetGame();setInterval(()=>{update();draw();},20);
</script></body></html>
